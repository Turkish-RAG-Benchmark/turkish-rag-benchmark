[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trrag"
version = "0.2.0"
description = "Türkçe akademik metinler için RAG retrieval benchmark'ı"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "PyStemmer>=2.2",
    "llama-index-core>=0.12",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
figures = ["matplotlib>=3.8"]

[project.scripts]
trrag-eval = "trrag.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
